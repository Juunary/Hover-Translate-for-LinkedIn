<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 272px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #1b1f23;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      label { color: #40464c; }
      select, input[type="number"] {
        font: inherit;
        padding: 3px 5px;
        border: 1px solid #c9ccd0;
        border-radius: 5px;
        background: #fff;
      }
      input[type="number"] { width: 68px; }
      .hint {
        margin: 4px 0 0;
        font-size: 11px;
        color: #767b80;
      }
    </style>
  </head>
  <body>
    <h1>Hover Translate for LinkedIn</h1>

    <div class="row">
      <label for="enabled">Enabled</label>
      <input type="checkbox" id="enabled" />
    </div>

    <div class="row">
      <label for="target">Translate to</label>
      <select id="target"></select>
    </div>

    <div class="row">
      <label for="delay">Hover delay (ms)</label>
      <input type="number" id="delay" min="0" max="3000" step="50" />
    </div>

    <div class="row">
      <label for="maxChars">Max paragraph</label>
      <input type="number" id="maxChars" min="80" max="1200" step="20" />
    </div>
    <p class="hint">Paragraphs longer than this fall back to the sentence under your cursor.</p>

    <script src="langs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
